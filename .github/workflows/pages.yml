name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one deploy at a time; let a running one finish rather than cancelling,
# so a half-published site is never left behind.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # One patch version per push, shown in the status bar. Guarded against
      # its own commit re-triggering this: that commit's message starts with
      # "Bump version to", so the second run here is skipped and only the
      # already-bumped package.json gets built and deployed.
      - name: Bump version
        id: bump
        if: ${{ !startsWith(github.event.head_commit.message || '', 'Bump version to') }}
        run: echo "version=$(node scripts/bump-version.mjs)" >> "$GITHUB_OUTPUT"

      - name: Build
        # The app is served from a subpath on Pages, so <base href> has to
        # match or the assets and the service worker resolve against the
        # domain root. Sourcemaps are omitted from the release build.
        env:
          BASE_HREF: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Commit version bump
        if: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "Bump version to ${{ steps.bump.outputs.version }}"
          git push

      - name: Disable Jekyll
        # Pages would otherwise skip files and folders beginning with an
        # underscore.
        run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
